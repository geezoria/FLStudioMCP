[project]
name = "fl-studio-mcp"
version = "0.3.0"
description = "Comprehensive Model Context Protocol server for FL Studio — full control over transport, patterns, channels, mixer, plugins, piano roll, playlist, arrangement, automation and rendering, plus voice-to-MIDI and audio-file analysis."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "fLMCP" }]
keywords = ["fl-studio", "mcp", "model-context-protocol", "midi", "daw", "music", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "anyio>=4.0",
    "pydantic>=2.0",
]

# Heavy, optional dependencies. The core MCP server (transport, mixer, channels,
# plugins, patterns, piano roll, generators) runs WITHOUT any of these — they are
# imported lazily, only when a voice-to-MIDI or audio-analysis tool is actually
# called. Install with:  pip install "fl-studio-mcp[audio]"
[project.optional-dependencies]
audio = [
    "numpy>=1.23",
    "scipy>=1.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
]
gui = [
    "dearpygui>=1.9",
]
# Polyphonic transcription via Spotify Basic Pitch (chords / full-mix content).
# These are the runtime deps Basic Pitch needs, all of which install cleanly on
# Python 3.10–3.12. Basic Pitch ITSELF must be installed separately with
# `pip install basic-pitch --no-deps` because its published metadata pins
# `tensorflow<2.15.1` for Python>=3.11, which has no compatible build on 3.12;
# the ONNX runtime below is used for inference instead (no TensorFlow needed).
# The Windows installer's -Polyphonic switch does both steps automatically.
polyphonic = [
    "onnxruntime>=1.16",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",
    "mido>=1.2",
    # Basic Pitch 0.4 imports resampy at inference time. resampy 0.4.2 still
    # imports pkg_resources, which was removed in newer setuptools releases.
    "resampy>=0.2.2,<0.4.3",
    "setuptools<81",
]
dev = [
    "pytest>=7.0",
    "numpy>=1.23",
    "ruff>=0.6",
    # Offline FL Studio API stubs — let the test suite import the FL-side bridge
    # and exercise its handlers (catches signature/arity mistakes) without FL.
    "fl-studio-api-stubs>=37",
]

[project.urls]
Homepage = "https://github.com/geezoria/FLStudioMCP"
Repository = "https://github.com/geezoria/FLStudioMCP"
Issues = "https://github.com/geezoria/FLStudioMCP/issues"

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
# Focus on real correctness issues (pyflakes + syntax errors), not style noise.
# `ruff check .` passes clean across src/, tests/ and fl_bridge/.
select = ["F", "E9"]
