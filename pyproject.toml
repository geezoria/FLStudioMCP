[project]
name = "flmcp"
version = "0.4.0"
description = "The most complete MCP server for FL Studio 2024–2026: let Claude and other AI assistants compose, arrange and mix in FL Studio — 160+ tools, piano-roll writing, voice-to-MIDI and audio analysis."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "geezoria" }]
keywords = ["fl-studio", "fl studio", "mcp", "model-context-protocol", "mcp-server", "midi", "daw", "music-production", "claude", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "anyio>=4.0",
    "pydantic>=2.0",
]

# Heavy, optional dependencies. The core MCP server (transport, mixer, channels,
# plugins, patterns, piano roll, generators) runs WITHOUT any of these — they are
# imported lazily, only when a voice-to-MIDI or audio-analysis tool is actually
# called. Install with:  pip install "flmcp[audio]"
[project.optional-dependencies]
audio = [
    "numpy>=1.23",
    "scipy>=1.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
]
gui = [
    "dearpygui>=1.9",
]
# Polyphonic transcription via Spotify Basic Pitch (chords / full-mix content).
# These are the runtime deps Basic Pitch needs, all of which install cleanly on
# Python 3.10–3.12. Basic Pitch ITSELF must be installed separately with
# `pip install basic-pitch --no-deps` because its published metadata pins
# `tensorflow<2.15.1` for Python>=3.11, which has no compatible build on 3.12;
# the ONNX runtime below is used for inference instead (no TensorFlow needed).
# The Windows installer's -Polyphonic switch does both steps automatically.
polyphonic = [
    "onnxruntime>=1.16",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",
    "mido>=1.2",
]
dev = [
    "pytest>=7.0",
    "numpy>=1.23",
    "ruff>=0.6",
    # Offline FL Studio API stubs — let the test suite import the FL-side bridge
    # and exercise its handlers (catches signature/arity mistakes) without FL.
    "fl-studio-api-stubs>=37",
]

[project.urls]
Homepage = "https://github.com/geezoria/FLStudioMCP"
Repository = "https://github.com/geezoria/FLStudioMCP"
Issues = "https://github.com/geezoria/FLStudioMCP/issues"
Changelog = "https://github.com/geezoria/FLStudioMCP/blob/main/CHANGELOG.md"

[project.scripts]
flmcp = "fl_studio_mcp.cli:main"
fl-studio-mcp = "fl_studio_mcp.cli:main"  # legacy alias

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

# Ship the FL-side scripts inside the wheel so `flmcp install` works from PyPI/uvx.
[tool.hatch.build.targets.wheel.force-include]
"fl_bridge/device_FLStudioMCP.py" = "fl_studio_mcp/fl_bridge/device_FLStudioMCP.py"
"fl_bridge/piano_roll/ComposeWithLLM.pyscript" = "fl_studio_mcp/fl_bridge/piano_roll/ComposeWithLLM.pyscript"

[tool.hatch.build.targets.sdist]
include = ["src", "fl_bridge", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "server.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
# Focus on real correctness issues (pyflakes + syntax errors), not style noise.
# `ruff check .` passes clean across src/, tests/ and fl_bridge/.
select = ["F", "E9"]
