name: Bug report
description: Something does not work (bridge not connecting, a tool fails, wrong result)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please run `flmcp doctor` first and paste its output below — it answers most of the questions we would ask.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you ask the assistant / which tool did it call, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `flmcp doctor`
      render: text
    validations:
      required: true
  - type: input
    id: fl
    attributes:
      label: FL Studio version and build
      placeholder: "FL Studio 2026 (26.1.7 build 5123)"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Desktop 1.x / Claude Code / Cursor / VS Code ..."
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows 11, Windows 10, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Bridge log
      description: Contents of `fLMCP_log.txt` from the `Settings/Hardware/fLMCP Bridge` folder (last ~50 lines).
      render: text
